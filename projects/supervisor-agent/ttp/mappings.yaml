# Technique -> check-surface -> capability mapping — the reviewable input
# tools/ttp_ingest.py reads to build ttp_mappings rows. BUILD-SPEC §1 file
# inventory; selection rubric in ttp/LIBRARY.md.
#
# Fields per entry:
#   surface        matches a real staleness_clocks.surface, or a free-text
#                   surface id for a non-clock surface (documented in
#                   ttp/LIBRARY.md's selection rubric)
#   capability     agent_or_skill value from `capabilities`, or null
#   detect_via     free text naming the mechanism, verbatim where possible
#   limit_via      free text, or null when nothing limits it today
#   verdict        covered | partially_covered | uncovered | asserted_unproven
#                   | not_applicable — never claim 'covered' without evidence_anchor
#   evidence_anchor
#                  a LIKE-matchable fragment of a real evidence.source_ref, or
#                   null. Resolved to evidence_id at ingest time (same pattern
#                   as tools/parsers.py's seed_clocks anchor resolution). NULL
#                   forces verdict to 'uncovered'/'not_applicable'/
#                   'asserted_unproven' at ingest (never 'covered').

