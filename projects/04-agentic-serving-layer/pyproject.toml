[project]
name = "agentic-serving-layer"
version = "0.1.0"
description = "Phase 1 serving layer for bputil-eval (bootloader track) and vuln_res (vuln-research track) — see PROPOSAL.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.118,<0.119",
    "uvicorn[standard]>=0.38,<0.39",
    "claude-agent-sdk>=0.2.169,<0.3",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "websockets>=13,<14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
